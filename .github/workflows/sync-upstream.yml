name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          # 添加上游远程仓库
          git remote add upstream https://github.com/Yu9191/wloc.git
          git fetch upstream

          # 自动获取当前工作流触发时的分支名（或默认主分支）
          CURRENT_BRANCH=$(git branch --show-current)
          if [ -z "$CURRENT_BRANCH" ]; then
            CURRENT_BRANCH="main"
          fi
          echo "当前操作分支: $CURRENT_BRANCH"

          # 确保切换到了正确的分支
          git checkout $CURRENT_BRANCH || git checkout -b $CURRENT_BRANCH

          # 合并上游仓库的对应分支（这里假设上游也是主分支，可按需改为 upstream/master）
          git merge upstream/main --allow-unrelated-histories --no-edit || echo "合并可能存在冲突或无更新"

          # 推送到你自己的仓库
          git push origin $CURRENT_BRANCH
